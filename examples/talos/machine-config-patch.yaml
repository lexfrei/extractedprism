# Run extractedprism as the per-node Kubernetes API load balancer on Talos
# Linux, replacing the built-in KubePrism.
#
# Render this into your machine config and apply the full config with
# `talosctl apply-config` -- incremental patches do not work cleanly for
# machine.pods (see README).
cluster:
  controlPlane:
    # The single cluster endpoint points at the local extractedprism proxy.
    endpoint: https://localhost:7445
machine:
  features:
    kubePrism:
      # extractedprism and KubePrism both bind localhost:7445, so the built-in
      # one must be disabled.
      enabled: false
  pods:
    - apiVersion: v1
      kind: Pod
      metadata:
        name: extractedprism
        namespace: kube-system
      spec:
        hostNetwork: true
        priorityClassName: system-node-critical
        containers:
          - name: extractedprism
            # Pin by digest in production.
            image: ghcr.io/lexfrei/extractedprism:v0.3.0
            args:
              # Static bootstrap endpoints: your control-plane node IPs.
              - --endpoints=198.51.100.1:6443,198.51.100.2:6443,198.51.100.3:6443
              # A static pod gets no ServiceAccount token, so Kubernetes
              # discovery cannot work here; the static list is the source.
              - --enable-discovery=false
              - --bind-port=7445
              - --health-port=7446
            livenessProbe:
              httpGet:
                path: /healthz
                port: 7446
                # Required: the health server binds 127.0.0.1, but a hostNetwork
                # pod's default probe target is the node IP.
                host: 127.0.0.1
              initialDelaySeconds: 3
              periodSeconds: 10
            readinessProbe:
              httpGet:
                path: /readyz
                port: 7446
                host: 127.0.0.1
              periodSeconds: 5
            securityContext:
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
